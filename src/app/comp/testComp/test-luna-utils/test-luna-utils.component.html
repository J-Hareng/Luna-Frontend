<div><h1>Luna Testing Ground</h1></div>
<app-luna-input
  style="display: inline-block"
  [label]="'TestLabel'"
  [Preselected]="'test'"
  (selectedInputEmitter)="onInputChange($event)"
></app-luna-input>

<app-luna-filter-selector
  [filterList]="this.filters"
  (sFilter)="onFilterChange($event)"
>
</app-luna-filter-selector>
<!-- <br /> -->
<div class="ChipsTest" style="width: 30%; height: 100%">
  <p>Luna From Test</p>
  <app-luna-from-chips
    class="luna-chips"
    [selectedChipsFrom]="this.lunaChipFromTest"
    [chips]="this.LunaChipsTestList"
    [UtilsSearch]="true"
    [UtilsSearch]="true"
  >
  </app-luna-from-chips>
</div>
<br />
<app-luna-textarea
  style="display: inline-block"
  [label]="'TestLabel'"
  [Preselected]="'test'"
  [FormControl]="this.textareaForm"
></app-luna-textarea>
<app-luna-slide-toggle
  [label]="'TestLabel'"
  [FromControl]="this.lunaSliderForm"
></app-luna-slide-toggle>
<div class="ChipsTest" style="width: 30%; height: 100%">
  <p>Luna Chips Test</p>
  <app-luna-chips
    [chips]="this.LunaChipsTestList"
    (selectedChipsEmitter)="this.lunachipevent($event)"
    [UtilsButtons]="true"
    [UtilsSearch]="true"
  ></app-luna-chips>
</div>
<div>
  <app-luna-file-upload-and-location-selector></app-luna-file-upload-and-location-selector>
</div>

<div id="CKpopup">
  <h1 mat-dialog-title>Submit {{ this.data.task.name }}<strong></strong></h1>
  <mat-dialog-content id="content">
    <p style="margin-bottom: 1em">
      Yeah looks like your nearly done with your task, Just check if somthing
      needes some fixes bevor your upload and then your done :)
    </p>
    <app-luna-file-upload-and-location-selector
      *ngIf="this.formWithFile.value"
      class="FileLocationSelector"
      [Task]="this.data.task"
      [FromControl]="fromUpload"
    ></app-luna-file-upload-and-location-selector>
  </mat-dialog-content>
  <mat-dialog-actions>
    <!-- <form> -->
    <div class="actions">
      <div class="btnRow">
        <button mat-button class="can" (click)="onNoClick()">Cancel</button>
        <div class="withFileWrapper">
          <app-luna-slide-toggle
            class="withFile"
            [label]="'With file ?'"
            [FromControl]="this.formWithFile"
          ></app-luna-slide-toggle>
        </div>
        <button
          mat-button
          class="sub"
          (click)="Submit()"
          [disabled]="!this.isValid()"
        >
          Upload
        </button>
      </div>
    </div>
    <!-- </form> -->
  </mat-dialog-actions>
</div>

<div id="CKpopup">
  <h1 mat-dialog-title><strong>Edit Collection</strong></h1>
  <mat-dialog-content id="content">
    <p>
      You can edit your collection propertys here. Changes done to
      <strong>{{ this.data.collection.name }}</strong
      >, A Collection is used for <strong>Storing</strong> files, you cann add
      tags for gruping the files.
    </p>
  </mat-dialog-content>
  <mat-dialog-actions>
    <form (ngSubmit)="Submit()" [formGroup]="fg">
      <mat-form-field>
        <mat-label>Collection Name</mat-label>

        <input
          matInput
          formControlName="name"
          placeholder="Cool Collection"
          required
        />
        @if (this.NameControll.hasError("required")) {
        <mat-error>Name is <strong>required</strong></mat-error>
        }
      </mat-form-field>

      <div id="TagWrapper">
        <div class="ChipWrapper">
          <span class="tagChip" *ngFor="let tag of data.collection.tags ?? []">
            {{ tag }}
            <mat-icon>edit</mat-icon>
          </span>
        </div>

        <div id="chipEditor">
          <input class="Custominput" placeholder="My Cool New Tag" />

          <button type="button" mat-icon-button>
            <mat-icon>add</mat-icon>
          </button>
        </div>
      </div>

      <div class="btnRow">
        <button mat-button class="can" (click)="onNoClick()">Cancel</button>

        <button
          mat-button
          class="sub"
          type="submit"
          [disabled]="
            this.fg.invalid ||
            (this.NameControll.value == data.collection.name &&
              this.TagsControll.value == data.collection.tags)
          "
        >
          Create
        </button>
      </div>
    </form>
  </mat-dialog-actions>
</div>

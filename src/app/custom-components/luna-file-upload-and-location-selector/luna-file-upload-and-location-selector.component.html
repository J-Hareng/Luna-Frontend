<div class="Location Selector Wrapper">
  <div class="location-selector">
    <div class="collSelector">
      <mat-form-field>
        <mat-select
          [placeholder]="'Select a collection'"
          [formControl]="this.CollectionFromControl"
        >
          <mat-option
            *ngFor="let coll of this.mc.groupColl"
            [value]="coll._id"
            >{{ coll.name }}</mat-option
          >
        </mat-select>
      </mat-form-field>

      <div class="file-selector">
        <app-luna-input
          [FormControl]="this.FutFileNameFromControl"
          [label]="'FileName'"
          [placeholder]="'Super Cool New File'"
        ></app-luna-input>
        <label class="custom-file-upload">
          <input type="file" (change)="this.onFileChange($event)" />
          {{ this.getTextForFileSelect() }}
        </label>
      </div>
    </div>
    <app-luna-from-chips
      class="luna-chips"
      [chips]="this.AvailableTags"
      [selectedChipsFrom]="this.TagsFromControl"
      [UtilsSearch]="true"
    >
    </app-luna-from-chips>
    <!-- <app-luna-chips
      class="luna-chips"
      [preeselectedChips]="this.preSelectedTags"
      [chips]="this.AvailableTags"
      (selectedChipsEmitter)="this.onTagsChange($event)"
      [UtilsSearch]="true"
    >
    </app-luna-chips> -->
  </div>
</div>
